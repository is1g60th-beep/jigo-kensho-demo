<!doctype html>
<html lang="ja">

<title>事後検証支援システム（デモ・1ファイル版）</title>
<style>
:root{--ink:#1f2328;--muted:#5f6b76;--line:#d0d7de;--bg:#f6f8fa;--accent:#1f4e78;--accent-bg:#e8f0f8;--warn:#9a6700;--warn-bg:#fff8c5;--err:#b42318;--err-bg:#fdecea;--ok:#1a7f37;--input:#fffbe6}
*{box-sizing:border-box}body{margin:0;font-family:"Meiryo UI","Yu Gothic UI","Hiragino Sans",sans-serif;font-size:15px;color:var(--ink);background:#fff;line-height:1.6}
header{background:var(--accent);color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header a{color:#fff;text-decoration:none;font-size:14px}header .brand{font-weight:bold;margin-right:12px}header .who{margin-left:auto;font-size:13px;opacity:.9}

.demo{background:#7a4b00;color:#fff;font-size:12px;padding:3px 16px}
main{max-width:1180px;margin:0 auto;padding:16px}

.err{color:var(--err)}.warn{color:var(--warn)}.ok{color:var(--ok)}.muted{color:var(--muted);font-size:13px}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:#fff}
.box.err{background:var(--err-bg);border-color:#f5c2c0;color:var(--ink)}.box.warnbox{background:var(--warn-bg);border-color:#e9d58a}
.q{border-bottom:1px solid var(--line);padding:10px 0}.q.hidden{display:none}.q .qt{font-weight:600}.tag{display:inline-block;font-size:11px;border-radius:10px;padding:0 8px;margin-right:6px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.req{background:var(--err-bg);border-color:#f5c2c0;color:var(--err)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.opts label{border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;background:#fff;font-size:14px}
.opts input{margin-right:4px}.opts label:has(input:checked){background:var(--accent-bg);border-color:var(--accent)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--input);max-width:100%}
textarea{width:100%;min-height:44px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 16px;font:inherit;cursor:pointer;text-decoration:none}
.btn.sub{background:#fff;color:var(--accent);border:1px solid var(--accent)}.btn.danger{background:var(--err)}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px;border-bottom:1px solid var(--line)}.tabs a{padding:6px 12px;text-decoration:none;color:var(--accent);border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;font-size:14px}
.tabs a.on{border-color:var(--line);background:#fff;font-weight:600;margin-bottom:-1px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.pane{max-height:80vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);font-size:14px}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}.item.cd{border-color:#e7a3a0}
.ref{font-weight:bold;padding:2px 8px;border-radius:6px;background:var(--accent-bg)}
.pill{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.p-S1{background:#fff8c5}.p-S3,.p-S5,.p-S6{background:#e8f0f8}.p-S7{background:#dafbe1}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.pane{max-height:none}}
@media print{header,.demo,.tabs,.bar,.noprint{display:none}main{max-width:none}}
.basis { font-size: .82em; color: #5a6b7d; }

</style>

  visibleQuestions(cat, codes, ver) {

  // 時刻順。時刻不明は直前に入力したイベントの直後（Excel 05 の並び順キー）
  sortEvents(evs) {
    let last = 0;
    const list = [...evs].sort((a, b) => a.input_order - b.input_order);
    for (const e of list) {
      let key;
      if (e.event_time) {
        const [h, m] = e.event_time.split(":").map(Number);
        key = (e.day_offset || 0) + (h * 60 + m) / 1440;
      } else key = last;
      e._key = key + e.input_order * 1e-7;
      last = Math.max(last, e._key);
    }
    return list.sort((a, b) => a._key - b._key);
  },
  DURATIONS: [["覚知→現場到着", "CALL", "ARR"], ["現場到着→傷病者接触", "ARR", "CONT"], ["傷病者接触→現場出発", "CONT", "DEP"],
    ["現場到着→現場出発（現場滞在）", "ARR", "DEP"], ["現場出発→搬送先到着", "DEP", "HOSPA"], ["覚知→搬送先到着", "CALL", "HOSPA"]],
  durations(evs) {
    const first = {};
    [...evs].sort((a, b) => a.input_order - b.input_order).forEach(e => { if (!first[e.event_type_code]) first[e.event_type_code] = e; });

  // 確認観点の回答から参考評価（検証基準書3章）
  referenceRating(answers) {

    if (answers.some(a => !a)) return "UNANSWERED";
    const n = answers.filter(a => a !== "NA");
    if (!n.length) return "A";
    if (n.filter(a => a === "INSUF").length * 2 >= n.length) return "E";
    if (n.includes("NOT")) return "C_LOW";
    if (n.includes("PART")) return "B";
    return "A";
  },
  differs(ref, rating) {

    return !((ref === "C_LOW" && ["C", "D"].includes(rating)) || ref === rating);
  },
  agreement(r1, r2) {

    if (r1 === r2) return "完全一致";
    if (r1 === "E" || r2 === "E") return "E（評価困難）を含む不一致";

  // 権限（決定事項W03・W04）
  assignments(db, cid) {

  // 個人情報の検出（警告のみ。app/logic.py の pii_warnings と同じ規則。app/tests/pii_cases.json で両方を試験）
  HON_EXCLUDE: ["隊員", "隊長", "家族", "患者", "本人", "医師", "看護師", "奥", "母", "父", "旦那", "娘", "息子", "妻", "夫", "祖母", "祖父", "通報者", "運転手", "客", "皆", "職員", "先生"],
  HOSP_GENERIC: ["総合", "大学", "救急", "三次", "二次", "搬送先", "近隣", "地域", "専門", "大", "当該", "別の", "同"],
  PII_RULES: [
    ["電話番号", /(?<!\d)0\d{1,4}[-‐－ー−]?\d{1,4}[-‐－ー−]?\d{3,4}(?!\d)/g],
    ["メールアドレス", /[\w.+-]+@[\w-]+\.[\w.-]+/g],
    ["生年月日", /(明治|大正|昭和|平成|令和)\s*(\d{1,2}|元)\s*年|\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日\s*生/g],
    ["住所", /[一-龥]{1,4}[都道府県][一-龥ぁ-んァ-ヶ]{1,8}[市区町村郡]|\d+\s*丁目|\d+\s*番地|(?<![\d-])\d{1,3}-\d{1,4}-\d{1,4}(?![\d-])/g],
    ["医療機関名", /([一-龥ァ-ヶ]{2,10})(病院|医院|クリニック|診療所)/g],
    ["人名と敬称", /([一-龥]{1,4})(さん|様|さま|氏|ちゃん|くん)/g],
    ["氏名の記載", /氏名\s*[:：は]/g],
  ],
  piiWarnings(text) {
    const found = [];
    for (const [label, rx] of L.PII_RULES) {
      for (const m of String(text || "").matchAll(rx)) {
        if (label === "電話番号") { const n = m[0].replace(/\D/g, "").length; if (n < 10 || n > 11) continue; }
        if (label === "住所" && /^0\d*-\d+-\d+$/.test(m[0])) continue;

        if (label === "人名と敬称" && L.HON_EXCLUDE.some(w => m[1].endsWith(w))) continue;

    return found;
  },
  caseTexts(db, cid) {
    const out = [];

    db.event.filter(r => r.case_id === cid).forEach(r => { out.push([`${r.event_id.slice(-3)}の内容`, r.content, "events"]); out.push([`${r.event_id.slice(-3)}の備考`, r.remarks, "events"]); });
    db.decision.filter(r => r.case_id === cid).forEach(r => [["decision_content", "判断した内容"], ["reason_text", "理由"], ["info_used", "使った情報"], ["action_taken", "実施した活動"], ["constraints_text", "制約"]]
      .forEach(([k, n]) => out.push([`${r.decision_id.slice(-3)}の${n}`, r[k], "decisions"])));
    return out.filter(x => x[1]);
  },

  // 活動記録の提出前チェック（Excel 03〜06 のチェック列）
  activityProblems(db, c) {
    const cid = c.case_id, cat = c.case_category_code, probs = [];

    const vis = L.visibleQuestions(cat, codes, c.question_version_id);

      const a = ans[q.question_id];
      if (!vis[q.question_id]) {
        if (a && (a.answer_code || a.note_text)) probs.push(["activity", q.question_id, `対象外になった質問に回答が残っています：${q.question_text}`, "warn"]);

      if (!a || !a.answer_code) { if (q.required) probs.push(["activity", q.question_id, `必須の質問が未回答：${q.question_text}`, "error"]); continue; }

    }
    const infos = {}; db.info_record.filter(r => r.case_id === cid).forEach(r => { infos[r.info_item_id] = r; });
    for (const it of L.infos(c.question_version_id)) {
      if (!L.applies(it, cat)) continue;
      const r = infos[it.info_item_id], aw = r && r.awareness_code;
      if (!aw) { if (it.required) probs.push(["info", it.info_item_id, `情報把握が未回答：${it.item_name}`, "error"]); continue; }
      if (aw === "TRIED" && !(r.note_text || "").trim()) probs.push(["info", it.info_item_id, `確認できなかった理由を記入：${it.item_name}`, "error"]);
      if (["PRE", "SCENE", "TRANS"].includes(aw)) {
        if (!r.source_code) probs.push(["info", it.info_item_id, `情報源を選択：${it.item_name}`, "error"]);

  },

  // 評価基準は割当時の版（c.criteria_version_id）。無効の項目・観点は除く
  criteria(ver) { return (MASTERS.criteria_sets[ver] || MASTERS.criteria_sets[MASTERS.versions.CRITERIA]).filter(x => x.active !== false)
    .map(x => ({ ...x, checkpoints: x.checkpoints.filter(cp => cp.active !== false) })); },
  reviewItems(c) { return L.criteria(c.criteria_version_id).filter(x => L.applies(x, c.case_category_code)); },

  // 一次検証の提出・確定前チェック（Excel 07 のチェック列）
  reviewProblems(db, c, sess, first) {
    const revs = {}; db.review.filter(r => r.review_session_id === sess.review_session_id).forEach(r => { revs[r.review_item_id] = r; });
    const chks = {}; db.review_check.filter(r => r.review_session_id === sess.review_session_id).forEach(r => { chks[r.checkpoint_id] = r; });
    const probs = [], t = s => (s || "").trim();
    if (first && !t(sess.situation_summary)) probs.push(["", "当時把握していた情報の要約を記入してください（後知恵バイアス対策）"]);
    for (const x of L.reviewItems(c)) {
      const v = x.review_item_id, r = revs[v], g = r && r.rating_code;
      if (!g) { probs.push([v, `${v} ${x.item_name}：未評価`]); continue; }
      if (!first) continue;
      for (const cp of x.checkpoints) {
        const a = chks[cp.checkpoint_id];
        if (!a || !a.answer_code) probs.push([v, `${cp.checkpoint_id}：確認観点が未回答`]);
        else if (["NOT", "PART", "INSUF"].includes(a.answer_code) && !t(a.memo)) probs.push([v, `${cp.checkpoint_id}：メモに根拠を記入`]);
      }
      const ref = L.referenceRating(x.checkpoints.map(cp => (chks[cp.checkpoint_id] || {}).answer_code));
      if (L.differs(ref, g) && !t(r.divergence_reason)) probs.push([v, `${v}：参考評価（${REF_LABEL[ref]}）と異なる理由を記入`]);
      if (["C", "D"].includes(g) && !(t(r.rationale) && t(r.improvement_item) && t(r.referenced_records))) probs.push([v, `${v}：C・Dは根拠・改善事項・参照記録IDが必須`]);
      if (g === "E" && !t(r.rationale)) probs.push([v, `${v}：評価困難の理由（不足資料）を根拠欄に`]);
      if (!r.viewpoint_code) probs.push([v, `${v}：評価視点を選択`]);
      if (r.viewpoint_code === "OUTC" && !t(r.rationale)) probs.push([v, `${v}：結果を考慮した理由を根拠欄に`]);
      if (r.good_practice_code === "Y" && !t(r.rationale)) probs.push([v, `${v}：良好事例の内容を根拠欄に`]);
    }
    return probs;
  },
};
if (typeof module !== "undefined") module.exports = { L, PROGRESS, ROLES, REF_LABEL, USERS, UNITS };

</script>
<script>
// 画面・保存（デモ版 1ファイル版）。データはこのブラウザの中（localStorage）だけに保存する。
"use strict";
const KEY = "jigo-kensho-demo-v1", UKEY = "jigo-kensho-demo-user";
const TABLES = ["case_record", "answer", "self_evaluation", "info_record", "event", "decision", "case_assignment",
  "review_session", "review", "review_check", "cause", "improvement", "audit_log"];
let DB, ME = null, FLASH = [], STORAGE_OK = true;

// ------------------------------------------------------------ 保存
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function load() {
  try { const s = localStorage.getItem(KEY); DB = s ? JSON.parse(s) : clone(SAMPLE_DB); }
  catch (e) { STORAGE_OK = false; DB = clone(SAMPLE_DB); }
  TABLES.forEach(t => { if (!DB[t]) DB[t] = []; });
  try { const u = localStorage.getItem(UKEY); ME = USERS.find(x => x.user_id === u) || null; } catch (e) { ME = null; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { STORAGE_OK = false; } }
function setMe(u) { ME = u; try { u ? localStorage.setItem(UKEY, u.user_id) : localStorage.removeItem(UKEY); } catch (e) { } }
function now() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function today() { return now().slice(0, 10); }
function audit(action, table, key, caseId, before, after, detail) {
  DB.audit_log.push({ log_id: DB.audit_log.length + 1, occurred_at: now(), user_id: ME ? ME.user_id : null, action, target_table: table || null,
    target_key: key || null, case_id: caseId || null, before_data: before ? JSON.stringify(before) : null, after_data: after ? JSON.stringify(after) : null, detail: detail || null });
}
function flash(m) { FLASH.push(m); }

// ------------------------------------------------------------ 表示の部品
const h = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lab = (set, code) => L.label(set, code);
const nz = v => { v = (v == null ? "" : String(v)).trim(); return v || null; };
function options(set, val, blank = true) {
  return (blank ? "<option value=''></option>" : "") + (MASTERS.choices[set] || []).map(([c, l]) => `<option value="${h(c)}" ${c === val ? "selected" : ""}>${h(l)}</option>`).join("");
}
function radios(name, set, val, extra = "") {
  return `<div class="opts">${(MASTERS.choices[set] || []).map(([c, l]) => `<label><input type="radio" name="${h(name)}" value="${h(c)}" ${c === val ? "checked" : ""} ${extra}>${h(l)}</label>`).join("")}</div>`;
}
const pill = c => `<span class="pill p-${c.progress_code}">${PROGRESS[c.progress_code]}</span>`;
const getCase = id => DB.case_record.find(c => c.case_id === id);
const sessions = cid => { const o = {}; DB.review_session.filter(s => s.case_id === cid).forEach(s => { o[s.session_role] = s; }); return o; };
const revsOf = sid => { const o = {}; DB.review.filter(r => r.review_session_id === sid).forEach(r => { o[r.review_item_id] = r; }); return o; };
function setProgress(c, p, detail) { audit("STATUS", "case_record", c.case_id, c.case_id, { progress: c.progress_code }, { progress: p }, detail); c.progress_code = p; }
function nextNo(list, prefix) { const used = new Set(list.map(x => parseInt(x.slice(-2), 10))); let k = 1; while (used.has(k)) k++; return `${prefix}${String(k).padStart(2, "0")}`; }

// ------------------------------------------------------------ 画面
function layout(body) {
  const nav = ME ? `<header><span class="brand">事後検証支援</span>
    <a href="#/">ホーム</a><a href="#/cases">症例一覧</a>
    ${ME.roles.includes("CREW") ? '<a href="#/new">症例登録</a>' : ""}
    ${ME.roles.includes("SUPERVISOR") ? '<a href="#/assign">検証担当の割当</a><a href="#/export">CSV出力</a>' : ""}
    ${ME.roles.some(r => ["SUPERVISOR", "REVIEWER"].includes(r)) ? '<a href="#/stats">集計</a>' : ""}
    ${ME.roles.some(r => ["SUPERVISOR", "SYSADMIN"].includes(r)) ? '<a href="#/audit">操作履歴</a>' : ""}
    ${ME.roles.includes("SYSADMIN") ? '<a href="#/admin">管理</a>' : ""}
    <a href="#/backup">データ</a>
    <span class="who">${h(ME.user_id)}／${h(UNITS[ME.unit_id])}／${ME.roles.map(r => ROLES[r]).join(" ")}</span>
    <button type="button" data-click="logout">ログアウト</button></header>` : "";
  const warn = STORAGE_OK ? "" : "<div class='flash'>このブラウザではデータを保存できません。画面を閉じると入力内容は消えます。</div>";
  const msgs = FLASH.map(m => `<div class="flash">${h(m)}</div>`).join(""); FLASH = [];
  return `<div class="demo">デモ版（1ファイル版 ${h(BUILD.version)}）：架空症例のみで使用してください。データはこの端末のブラウザの中だけに保存されます。</div>${nav}<main>${warn}${msgs}${body}</main>`;
}

function pageLogin() {
  return `<h1>ログイン（デモ用）</h1>
  <p class="muted">利用者を選ぶだけでログインします（本番は組織の認証基盤と連携）。役割ごとに見える画面と操作が変わります。1台のブラウザで役割を切り替えながら、活動隊→検証者→救急担当部署の流れを試せます。</p>
  <form data-act="login"><table><tr><th></th><th>利用者ID</th><th>名前（架空）</th><th>所属</th><th>役割</th></tr>
  ${USERS.map((u, i) => `<tr><td><input type="radio" name="user_id" value="${u.user_id}" id="u${i}"></td><td><label for="u${i}">${u.user_id}</label></td><td>${h(u.full_name)}</td><td>${h(UNITS[u.unit_id])}</td><td>${u.roles.map(r => ROLES[r]).join(" ")}</td></tr>`).join("")}
  </table><button class="btn">ログイン</button></form>`;
}

function visibleCases() { return DB.case_record.filter(c => L.canView(DB, ME, c)).sort((a, b) => b.case_id.localeCompare(a.case_id)); }

function pageHome() {
  const todo = [];
  for (const c of visibleCases()) {
    const a = L.assignments(DB, c.case_id), p = c.progress_code;
    if (ME.roles.includes("CREW") && c.crew_unit_id === ME.unit_id && p === "S1") todo.push([c, "活動記録の入力・提出", `#/case/${c.case_id}/activity`]);
    if (a.REVIEWER1 === ME.user_id && p === "S3") todo.push([c, "一次検証", `#/case/${c.case_id}/review`]);
    if (a.REVIEWER2 === ME.user_id && p === "S3") todo.push([c, "二重評価", `#/case/${c.case_id}/review2`]);
    if (ME.roles.includes("SUPERVISOR") && p === "S2") todo.push([c, "検証担当の割当", "#/assign"]);
    if (ME.roles.includes("SUPERVISOR") && ["S5", "S6"].includes(p)) todo.push([c, "原因分析・改善策", `#/case/${c.case_id}/upper`]);
  }
  const overdue = ME.roles.includes("SUPERVISOR") ? DB.improvement.filter(p => p.due_date && p.due_date < today() && !["DONE", "STOP", "NN"].includes(p.status_code)) : [];
  return `<h1>あなたの作業</h1>${todo.length ? `<table><tr><th>症例</th><th>状態</th><th>作業</th></tr>${todo.map(([c, w, l]) => `<tr><td>${c.case_id}</td><td>${pill(c)}</td><td><a href="${l}">${w}</a></td></tr>`).join("")}</table>` : "<p class='muted'>いま対応が必要な症例はありません。</p>"}
  ${overdue.length ? `<h2>期限を過ぎた改善策</h2><table><tr><th>改善ID</th><th>内容</th><th>担当</th><th>期限</th></tr>${overdue.map(p => `<tr><td><a href="#/case/${p.case_id}/upper">${p.improvement_id}</a></td><td>${h(p.improvement_content)}</td><td>${h(p.department_text)}</td><td class="err">${p.due_date}</td></tr>`).join("")}</table>` : ""}`;
}

function pageCases(q) {
  let rows = visibleCases();
  if (q.cat) rows = rows.filter(c => c.case_category_code === q.cat);
  if (q.prog) rows = rows.filter(c => c.progress_code === q.prog);
  return `<h1>症例一覧</h1><form data-act="filter" class="noprint">症例区分 <select name="cat"><option value="">すべて</option>${options("L_CASECAT", q.cat, false)}</select>
  状態 <select name="prog"><option value="">すべて</option>${Object.entries(PROGRESS).map(([k, v]) => `<option value="${k}" ${q.prog === k ? "selected" : ""}>${v}</option>`).join("")}</select> <button class="btn sub">絞り込み</button></form>
  <table><tr><th>症例ID</th><th>年度</th><th>発生年月</th><th>症例区分</th><th>年齢区分</th><th>状態</th></tr>
  ${rows.map(c => `<tr><td><a href="#/case/${c.case_id}/view">${c.case_id}</a></td><td>${c.fiscal_year}</td><td>${h(c.occurrence_month)}</td><td>${h(lab("L_CASECAT", c.case_category_code))}</td><td>${h(lab("L_AGE", c.age_group_code))}</td><td>${pill(c)}</td></tr>`).join("") || "<tr><td colspan='6' class='muted'>表示できる症例はありません</td></tr>"}</table>`;
}

function pageNew() {
  const q = (name, set, title, req = true) => `<div class="q"><div class="qt">${req ? '<span class="tag req">必須</span>' : ""}${title}</div>${radios(name, set, null)}</div>`;
  return `<h1>症例登録</h1><div class="box warnbox">氏名・生年月日・住所・具体的な出場先・隊員氏名は入力しません。症例IDは自動で付きます（年度-連番）。</div>
  <form data-act="caseNew">
  <div class="q"><div class="qt"><span class="tag req">必須</span>年度</div><input type="number" name="fiscal_year" value="${new Date().getFullYear()}" min="2000" max="2100"></div>
  <div class="q"><div class="qt"><span class="tag req">必須</span>発生年月 <span class="muted">（日は入力しない）</span></div><input type="month" name="occurrence_month"></div>
  ${q("case_category_code", "L_CASECAT", "症例区分 <span class='muted'>（質問の分岐に使います。複数該当時は主たる区分）</span>")}
  ${q("age_group_code", "L_AGE", "年齢区分")}${q("sex_code", "L_SEX", "性別（検証上必要な場合のみ）", false)}
  ${q("etiology_code", "L_ETIOL", "外因・内因区分")}${q("review_target_code", "L_TARGET", "検証対象区分")}
  <div class="bar"><button class="btn">登録して活動記録へ</button></div></form>`;
}

function caseNav(c, tab) {
  const t = [["view", "記録の確認"], ["activity", "活動記録"], ["info", "情報把握"], ["events", "時系列"], ["decisions", "判断・活動"], ["submit", "提出前チェック"], ["review", "一次検証"], ["review2", "二重評価"]];
  if (ME.roles.includes("SUPERVISOR")) t.push(["upper", "原因分析・改善策"]);
  return `<h1>症例 ${c.case_id} ${pill(c)}</h1><div class="tabs">${t.map(([k, v]) => `<a href="#/case/${c.case_id}/${k}" class="${k === tab ? "on" : ""}">${v}</a>`).join("")}</div>`;
}

function caseDoc(c) {
  const cid = c.case_id, ans = {}, selfs = {};
  DB.answer.filter(r => r.case_id === cid).forEach(r => { ans[r.question_id] = r; });
  DB.self_evaluation.filter(r => r.case_id === cid).forEach(r => { selfs[r.question_id] = r; });
  const codes = {}; Object.values({ ...ans, ...selfs }).forEach(r => { codes[r.question_id] = r.answer_code; });
  const vis = L.visibleQuestions(c.case_category_code, codes, c.question_version_id), lines = [], selfLines = [];
  for (const q of L.qs(c.question_version_id)) {
    if (!vis[q.question_id]) continue;
    const r = q.record_category === "自己評価" ? selfs[q.question_id] : ans[q.question_id];
    const val = !r || !r.answer_code ? "（未回答）" : (r.answer_code === "W" ? "" : lab(q.choice_set_id, r.answer_code));
    const text = [val, r && r.note_text].filter(Boolean).join("／") || "（記述なし）";
    (q.record_category === "自己評価" ? selfLines : lines).push({ id: q.question_id, cat: q.record_category, q: q.question_text, a: text });
  }
  const infos = {}; DB.info_record.filter(r => r.case_id === cid).forEach(r => { infos[r.info_item_id] = r; });
  const infoLines = L.infos(c.question_version_id).filter(it => L.applies(it, c.case_category_code)).map(it => {
    const r = infos[it.info_item_id] || {};
    const parts = [lab("L_AWARE", r.awareness_code) || "（未回答）"];
    if (r.acquired_time) parts.push(r.acquired_time);
    if (r.source_code) parts.push("情報源：" + lab("L_SOURCE", r.source_code));
    if (r.reflection_code) parts.push("方針への反映：" + lab("L_REFLECT", r.reflection_code));
    if (r.note_text) parts.push(r.note_text);
    return { id: it.info_item_id, name: it.item_name, text: parts.join("／") };
  });
  const events = L.sortEvents(DB.event.filter(e => e.case_id === cid));
  return { lines, selfLines, infoLines, events, durations: L.durations(events), decisions: DB.decision.filter(d => d.case_id === cid).sort((a, b) => a.decision_id.localeCompare(b.decision_id)) };
}

function recordHTML(d, showSelf) {
  return `<h3>活動経過（時刻順）</h3>${d.events.map(e => `<div>${e.event_time || "時刻不明"}${e.day_offset ? `（+${e.day_offset}日）` : ""}${["EST", "MEM"].includes(e.time_certainty_code) ? `（${lab("L_TCERT", e.time_certainty_code)}）` : ""}　${h(lab("L_EVENT", e.event_type_code))}${e.content ? "：" + h(e.content) : ""} <span class="muted">${e.event_id.slice(-3)}</span></div>`).join("") || "<div class='muted'>（時系列が未入力）</div>"}
  <div class="muted">${d.durations.map(([l, v]) => `${l} ${v}`).join("／")}</div>
  <h3>活動隊の記録</h3>${d.lines.map(x => `<div>［${x.cat}］${h(x.q)}：${h(x.a)} <span class="muted">${x.id}</span></div>`).join("")}
  <h3>情報の把握状況</h3>${d.infoLines.map(x => `<div>${h(x.name)}：${h(x.text)} <span class="muted">${x.id}</span></div>`).join("")}
  <h3>判断と理由</h3>${d.decisions.map(x => `<div>${x.decision_id.slice(-3)}（${x.decision_time || "時点未記録"}・${h(lab("L_DECTYPE", x.decision_type_code) || "（未入力）")}）：${h(x.decision_content)}。理由：${h(lab("L_REASON", x.reason_code))}${x.reason_text ? `（${h(x.reason_text)}）` : ""}。実施：${h(x.action_taken || "（未入力）")}→${h(lab("L_RESULT", x.action_result_code) || "（未入力）")}${x.constraints_text ? "。制約：" + h(x.constraints_text) : ""}</div>`).join("") || "<div class='muted'>（判断の記録なし）</div>"}
  ${showSelf ? `<h3>自己評価・振り返り</h3>${d.selfLines.map(x => `<div>${h(x.q)}：${h(x.a)}</div>`).join("")}` : ""}`;
}

function pageView(c) {
  const d = caseDoc(c), a = L.assignments(DB, c.case_id), ss = sessions(c.case_id), first = ss.FIRST;
  let rev = "";
  if (first && ["SUBMIT", "FIX"].includes(first.status_code)) {
    const items = {}; L.reviewItems(c).forEach(x => { items[x.review_item_id] = x; });
    const rs = DB.review.filter(r => r.review_session_id === first.review_session_id).sort((p, q) => p.review_item_id.localeCompare(q.review_item_id));
    rev = `<h2>一次検証結果${first.status_code !== "FIX" ? "（未確定）" : ""}</h2><p><b>当時把握していた情報の要約：</b>${h(first.situation_summary || "（未入力）")}</p>
    <table><tr><th>項目</th><th>評価</th><th>参考評価</th><th>根拠・改善事項</th></tr>${rs.map(r => `<tr><td>${r.review_item_id} ${h((items[r.review_item_id] || {}).item_name)}</td><td><b>${r.rating_code || "（未評価）"}</b>${r.good_practice_code === "Y" ? "<br><span class='ok'>良好事例</span>" : ""}</td><td>${REF_LABEL[r.reference_rating] || ""}</td><td>${r.rationale ? "根拠：" + h(r.rationale) : ""}${r.improvement_item ? "<br>改善事項：" + h(r.improvement_item) : ""}${r.divergence_reason ? `<br><span class="muted">参考評価と異なる理由：${h(r.divergence_reason)}</span>` : ""}</td></tr>`).join("")}</table>`;
  }
  const causes = DB.cause.filter(x => x.case_id === c.case_id), imps = DB.improvement.filter(x => x.case_id === c.case_id);
  return caseNav(c, "view") + `<p class="muted">${h(lab("L_CASECAT", c.case_category_code))}／${h(lab("L_AGE", c.age_group_code))}／${h(lab("L_ETIOL", c.etiology_code))}／${c.fiscal_year}年度（${h(c.occurrence_month)}）／質問の版 ${c.question_version_id}${c.criteria_version_id ? "／評価基準の版 " + c.criteria_version_id : ""}${a.REVIEWER1 ? `／一次検証 ${a.REVIEWER1}${a.REVIEWER2 ? "・第二 " + a.REVIEWER2 : ""}` : ""}
  <button class="btn sub noprint" type="button" data-click="print">印刷・PDF保存</button></p>
  <div class="box">${recordHTML(d, true)}</div>${rev}
  ${causes.length ? `<h2>原因分析</h2><table><tr><th>ID</th><th>対象</th><th>原因分類</th><th>要因</th><th>詳細</th><th>確実性</th></tr>${causes.map(x => `<tr><td>${x.cause_id}</td><td>${x.review_item_id}</td><td>${h(lab("L_CAUSE", x.cause_category_code))}</td><td>${h(lab("L_LEVEL", x.factor_level_code))}</td><td>${h(x.cause_detail)}</td><td>${h(lab("L_CERT", x.certainty_code))}</td></tr>`).join("")}</table>` : ""}
  ${imps.length ? `<h2>改善策</h2><table><tr><th>ID</th><th>区分</th><th>内容</th><th>担当</th><th>期限</th><th>状況</th><th>効果</th></tr>${imps.map(p => `<tr><td>${p.improvement_id}</td><td>${h(lab("L_IMPCAT", p.improvement_category_code))}</td><td>${h(p.improvement_content)}</td><td>${h(p.department_text)}</td><td>${h(p.due_date)}</td><td>${h(lab("L_STATUS", p.status_code))}</td><td>${h(lab("L_EFFECT", p.effect_result_code))}</td></tr>`).join("")}</table>` : ""}
  <p class="muted">この画面は入力内容を並べたものです。入力されていない情報は補っていません。</p>`;
}

function fs(editable, inner) { return `<fieldset ${editable ? "" : "disabled"} style="border:0;padding:0;margin:0">${inner}</fieldset>`; }

function pageActivity(c) {
  const ed = L.canEditActivity(ME, c), ans = {};
  DB.answer.concat(DB.self_evaluation).filter(r => r.case_id === c.case_id).forEach(r => { ans[r.question_id] = r; });
  const codes = {}; Object.values(ans).forEach(r => { codes[r.question_id] = r.answer_code; });
  const vis = L.visibleQuestions(c.case_category_code, codes, c.question_version_id);
  let html = "", sec = null;
  for (const q of L.qs(c.question_version_id)) {
    if (!L.applies(q, c.case_category_code)) continue;
    if (q.section !== sec) { sec = q.section; html += `<h2>${h(sec)}</h2>`; }
    const a = ans[q.question_id] || {};
    html += `<div class="q ${vis[q.question_id] ? "" : "hidden"}" data-qid="${q.question_id}" data-cond="${q.cond_question_id || ""}" data-show="${q.show_if.join("|")}" data-note="${q.note_if.join("|")}">
    <div class="qt">${q.required ? '<span class="tag req">必須</span>' : ""}<span class="tag">${q.record_category}</span>${h(q.question_text)} <span class="muted">${q.question_id}</span></div>
    ${q.help_text ? `<div class="muted">${h(q.help_text)}</div>` : ""}${q.basis ? `<div class="muted basis">根拠：${h(q.basis)}</div>` : ""}
    <div class="opts">${MASTERS.choices[q.choice_set_id].map(([code, l]) => `<label><input type="radio" name="q_${q.question_id}" value="${h(code)}" ${a.answer_code === code ? "checked" : ""}>${h(l)}</label>`).join("")}<label class="muted"><input type="radio" name="q_${q.question_id}" value="" ${!a.answer_code ? "checked" : ""}>未回答</label></div>
    <textarea name="n_${q.question_id}" placeholder="補足・自由記述（個人を特定する情報は書かない）">${h(a.note_text)}</textarea><div class="notehint err" hidden>この回答では補足欄の記入が必要です</div></div>`;
  }
  return caseNav(c, "activity") + `<div class="box warnbox">活動時に<b>把握・認識していたこと</b>を記録します。検証者の視点での評価は書きません。分からない場合は「不明」「確認できなかった」「記録なし」「該当なし」を区別して選んでください。</div>
  ${ed ? "" : "<p class='muted'>閲覧のみ（入力できるのは自隊の隊員で、状態が「活動隊入力中」のときです）</p>"}
  <form data-act="activity" data-cid="${c.case_id}">${fs(ed, html)}${ed ? `<div class="bar"><button class="btn">保存</button><a class="btn sub" href="#/case/${c.case_id}/info">次へ：情報把握</a></div>` : ""}</form>`;
}

function pageInfo(c) {
  const ed = L.canEditActivity(ME, c), recs = {};
  DB.info_record.filter(r => r.case_id === c.case_id).forEach(r => { recs[r.info_item_id] = r; });
  const body = L.infos(c.question_version_id).filter(it => L.applies(it, c.case_category_code)).map(it => {
    const r = recs[it.info_item_id] || {}, i = it.info_item_id;
    return `<div class="q"><div class="qt">${it.required ? '<span class="tag req">必須</span>' : ""}${h(it.item_name)} <span class="muted">${i}${it.hint ? "　" + h(it.hint) : ""}${it.basis ? "　根拠：" + h(it.basis) : ""}</span></div>
    ${radios("aw_" + i, "L_AWARE", r.awareness_code)}
    把握時刻 <input type="time" name="t_${i}" value="${h(r.acquired_time)}"> 情報源 <select name="src_${i}">${options("L_SOURCE", r.source_code)}</select>
    方針への反映 <select name="ref_${i}">${options("L_REFLECT", r.reflection_code)}</select>
    <textarea name="note_${i}" placeholder="内容・反映の仕方・確認できなかった理由">${h(r.note_text)}</textarea></div>`;
  }).join("");
  return caseNav(c, "info") + `<p class="muted">情報の種類ごとに、把握していたか・いつ・誰から・方針に反映したかを記録します。時刻が分からなければ空欄でかまいません。</p>
  <form data-act="info" data-cid="${c.case_id}">${fs(ed, body)}${ed ? `<div class="bar"><button class="btn">保存</button><a class="btn sub" href="#/case/${c.case_id}/events">次へ：時系列</a></div>` : ""}</form>`;
}

function pageEvents(c) {
  const ed = L.canEditActivity(ME, c), evs = L.sortEvents(DB.event.filter(e => e.case_id === c.case_id)), n = evs.length + (ed ? 5 : 0);
  let rows = "";
  for (let i = 0; i < n; i++) {
    const e = evs[i] || {};
    rows += `<tr><td class="muted">${e.event_id ? e.event_id.slice(-3) : ""}<input type="hidden" name="id_${i}" value="${h(e.event_id)}"></td>
    <td><input type="number" name="day_${i}" value="${e.day_offset || ""}" min="0" max="3" style="width:56px" title="覚知日は空欄（0）、翌日は1"></td>
    <td><input type="time" name="time_${i}" value="${h(e.event_time)}"></td><td><select name="cert_${i}">${options("L_TCERT", e.time_certainty_code)}</select></td>
    <td><select name="type_${i}">${options("L_EVENT", e.event_type_code)}</select></td><td><input type="text" name="content_${i}" value="${h(e.content)}" style="width:100%"></td>
    <td><input type="text" name="remarks_${i}" value="${h(e.remarks)}"></td>${ed ? `<td>${e.event_id ? `<input type="checkbox" name="del_${i}" value="1">` : ""}</td>` : ""}</tr>`;
  }
  return caseNav(c, "events") + `<p class="muted">1行1イベント。時刻が分からない場合は空欄のまま（確実性は自動で「不明」）。時刻不明のイベントは、直前に入力したイベントの後ろに並びます。区分を空にするか「削除」に印を付けると削除します。</p>
  <form data-act="events" data-cid="${c.case_id}">${fs(ed, `<div style="overflow-x:auto"><table><tr><th>ID</th><th>経過日</th><th>時刻</th><th>確実性</th><th>イベント区分</th><th>内容</th><th>備考</th>${ed ? "<th>削除</th>" : ""}</tr>${rows}</table></div><input type="hidden" name="rows" value="${n}">`)}
  <h3>所要時間（自動）</h3><table>${L.durations(evs).map(([l, v]) => `<tr><td>${l}</td><td>${v}</td></tr>`).join("")}</table>
  ${ed ? `<div class="bar"><button class="btn">保存（空き行は保存後に追加されます）</button><a class="btn sub" href="#/case/${c.case_id}/decisions">次へ：判断・活動</a></div>` : ""}</form>`;
}

function pageDecisions(c) {
  const ed = L.canEditActivity(ME, c), decs = DB.decision.filter(d => d.case_id === c.case_id).sort((a, b) => a.decision_id.localeCompare(b.decision_id));
  const evs = L.sortEvents(DB.event.filter(e => e.case_id === c.case_id)), n = decs.length + (ed ? 3 : 0);
  let body = "";
  for (let i = 0; i < n; i++) {
    const d = decs[i] || {};
    body += `<div class="item"><input type="hidden" name="id_${i}" value="${h(d.decision_id)}"><b>${d.decision_id || "新しい判断"}</b>
    <div>対応イベント <select name="event_${i}"><option value=""></option>${evs.map(e => `<option value="${e.event_id}" ${d.event_id === e.event_id ? "selected" : ""}>${e.event_id.slice(-3)} ${e.event_time || "時刻不明"} ${h(lab("L_EVENT", e.event_type_code))}</option>`).join("")}</select>
    判断時点 <input type="time" name="time_${i}" value="${h(d.decision_time)}"> 種別 <select name="type_${i}">${options("L_DECTYPE", d.decision_type_code)}</select></div>
    <div>判断した内容 <input type="text" name="content_${i}" value="${h(d.decision_content)}" style="width:100%"></div>
    <div>理由の区分 <select name="rcode_${i}">${options("L_REASON", d.reason_code)}</select> 具体的な理由 <input type="text" name="rtext_${i}" value="${h(d.reason_text)}" style="width:60%"></div>
    <div>使った情報（情報ID可） <input type="text" name="info_${i}" value="${h(d.info_used)}"> 実施した活動 <input type="text" name="action_${i}" value="${h(d.action_taken)}">
    結果 <select name="result_${i}">${options("L_RESULT", d.action_result_code)}</select></div>
    <div>影響した制約・困難 <input type="text" name="cons_${i}" value="${h(d.constraints_text)}" style="width:70%">${ed && d.decision_id ? `　<label><input type="checkbox" name="del_${i}" value="1">削除</label>` : ""}</div></div>`;
  }
  return caseNav(c, "decisions") + `<p class="muted">主要な判断ごとに1件。判断した内容・理由・使った情報・実施した活動を、当時の認識で記録します。判断した内容を空にすると削除します。</p>
  <form data-act="decisions" data-cid="${c.case_id}">${fs(ed, body + `<input type="hidden" name="rows" value="${n}">`)}${ed ? `<div class="bar"><button class="btn">保存</button><a class="btn sub" href="#/case/${c.case_id}/submit">次へ：提出前チェック</a></div>` : ""}</form>`;
}

function pageSubmit(c) {
  const probs = L.activityProblems(DB, c), errors = probs.filter(p => p[3] === "error"), ed = L.canEditActivity(ME, c);
  return caseNav(c, "submit") + (probs.length ? `<div class="box ${errors.length ? "err" : "warnbox"}"><b>${errors.length} 件の未入力${probs.length > errors.length ? `、${probs.length - errors.length} 件の確認事項` : ""}があります</b><ul>${probs.map(p => `<li class="${p[3] === "error" ? "err" : "warn"}"><a href="#/case/${c.case_id}/${p[0]}">${h(p[2])}</a></li>`).join("")}</ul></div>` : "<div class='box ok'>未入力の項目はありません。</div>")
    + (ed ? `<form data-act="submit" data-cid="${c.case_id}"><p>提出すると、差戻しがない限り編集できなくなります。</p><button class="btn" ${errors.length ? "disabled" : ""}>提出する</button></form>` : "");
}

function pageAssign() {
  const reviewers = USERS.filter(u => u.roles.includes("REVIEWER"));
  const waiting = DB.case_record.filter(c => c.progress_code === "S2");
  const sel = (name, c, blank) => `<select name="${name}"><option value="">${blank}</option>${reviewers.map(r => `<option value="${r.user_id}" ${r.unit_id === c.crew_unit_id ? "disabled" : ""}>${r.user_id}（${UNITS[r.unit_id]}）</option>`).join("")}</select>`;
  return `<h1>検証担当の割当</h1><p class="muted">活動隊と同じ所属の検証者は割り当てられません。第二検証者（二重評価）は対象症例のみ指名します。</p>
  ${waiting.map(c => `<form data-act="assign" data-cid="${c.case_id}" class="item"><b><a href="#/case/${c.case_id}/view">${c.case_id}</a></b> ${h(lab("L_CASECAT", c.case_category_code))}（活動隊：${UNITS[c.crew_unit_id]}）<br>
  第一検証者 ${sel("r1", c, "")} 第二検証者 ${sel("r2", c, "指名しない")} <button class="btn">割り当てる</button></form>`).join("") || "<p class='muted'>割当を待っている症例はありません。</p>"}`;
}

function pageReview(c) {
  const a = L.assignments(DB, c.case_id), ss = sessions(c.case_id), sess = ss.FIRST;
  if (!sess) return caseNav(c, "review") + "<p class='muted'>まだ検証担当が割り当てられていません。</p>";
  const mine = a.REVIEWER1 === ME.user_id;
  if (!mine && !ME.roles.includes("SUPERVISOR")) return caseNav(c, "review") + "<p class='muted'>この症例の一次検証の担当ではありません。</p>";
  const ed = mine && c.progress_code === "S3" && ["DRAFT", "SUBMIT"].includes(sess.status_code);
  const revs = revsOf(sess.review_session_id), chks = {};
  DB.review_check.filter(r => r.review_session_id === sess.review_session_id).forEach(r => { chks[r.checkpoint_id] = r; });
  const sec = ss.SECOND, second = sec && ["SUBMIT", "FIX"].includes(sec.status_code) && ["SUBMIT", "FIX"].includes(sess.status_code) ? revsOf(sec.review_session_id) : {};
  const items = L.reviewItems(c).map(x => {
    const r = revs[x.review_item_id] || {}, s2 = second[x.review_item_id], v = x.review_item_id;
    return `<div class="item ${["C", "D"].includes(r.rating_code) ? "cd" : ""}" data-vid="${v}"><b>${v} ${h(x.item_name)}</b><div class="muted">${h(x.criteria)}</div>${x.basis ? `<div class="muted basis">根拠：${h(x.basis)}</div>` : ""}
    <details><summary class="muted">C・Dの目安</summary><div>C：${h(x.anchor_c)}</div><div>D：${h(x.anchor_d)}</div></details><div class="muted">② 確認観点</div>
    ${x.checkpoints.map(cp => { const k = chks[cp.checkpoint_id] || {}; return `<div class="cp"><div>${h(cp.checkpoint_text)} <span class="muted">${cp.checkpoint_id}（${h(cp.related_records)}）</span>${cp.basis ? `<div class="muted basis">根拠：${h(cp.basis)}</div>` : ""}</div>${radios("cp_" + cp.checkpoint_id, "L_CHECK", k.answer_code)}<input type="text" name="cpm_${cp.checkpoint_id}" value="${h(k.memo)}" placeholder="メモ（満たさない・一部・資料不足は必須。記録IDを付ける）" style="width:100%"></div>`; }).join("")}
    <div style="margin-top:8px">参考評価：<span class="ref">${REF_LABEL[r.reference_rating] || ""}</span>　③ 評価区分 <span class="opts" style="display:inline-flex">${["A", "B", "C", "D", "E"].map(g => `<label><input type="radio" name="g_${v}" value="${g}" ${r.rating_code === g ? "checked" : ""}>${g}</label>`).join("")}</span>
    ${s2 ? `<span class="pill">第二評価 ${s2.rating_at_submit}／${L.agreement(r.rating_at_submit, s2.rating_at_submit)}${s2.discussion_code ? "／" + { SAME: "一致", KEEP: "協議し維持", CHG: "協議し変更" }[s2.discussion_code] : ""}</span>` : ""}</div>
    <textarea name="div_${v}" placeholder="参考評価と異なる区分を選んだ理由">${h(r.divergence_reason)}</textarea>
    <textarea name="rat_${v}" placeholder="評価根拠：事実（記録ID）→ 比べた基準 → 判断">${h(r.rationale)}</textarea>
    <textarea name="imp_${v}" placeholder="改善事項（C・Dは必須）：何がどうなればよいか">${h(r.improvement_item)}</textarea>
    参照した記録ID <input type="text" name="refrec_${v}" value="${h(r.referenced_records)}"> 評価視点 <select name="view_${v}">${options("L_VIEW", r.viewpoint_code)}</select>
    <label><input type="checkbox" name="good_${v}" value="Y" ${r.good_practice_code === "Y" ? "checked" : ""}>良好事例として共有</label></div>`;
  }).join("");
  const probs = ed ? L.reviewProblems(DB, c, sess, true) : [];
  return caseNav(c, "review") + `<p class="muted">当時把握できていた情報を基準に評価します（結果から評価しない）。① 当時情報の要約 → ② 確認観点 → ③ 評価区分 の順に入力。評価基準の版 ${sess.criteria_version_id}／状態：${{ DRAFT: "入力中", SUBMIT: "提出済（協議中）", FIX: "確定" }[sess.status_code]}</p>
  ${sec ? `<p class="muted">この症例は二重評価の対象です。${Object.keys(second).length ? "第二評価が提出されています（各項目に表示）。" : "両者の提出後に第二評価が表示されます。"}</p>` : ""}
  <div class="grid2"><div class="pane">${recordHTML(caseDoc(c), true)}</div><div><form data-act="review" data-cid="${c.case_id}">
  ${fs(ed, `<h3>① 当時把握していた情報の要約 <span class="tag req">必須</span></h3><textarea name="situation_summary" style="min-height:80px" placeholder="活動隊が各時点で何を知っていたかを2〜3行で。記録IDを付ける">${h(sess.situation_summary)}</textarea>${items}`)}
  ${ed ? `<div class="bar"><button class="btn sub" name="action" value="save">保存</button>${sess.status_code === "DRAFT" ? '<button class="btn" name="action" value="submit">提出（協議前の評価を保存）</button>' : '<button class="btn" name="action" value="fix">一次検証を確定</button>'}</div>
  <details class="box"><summary>活動隊に差し戻す（記録の補足が必要な場合）</summary><input type="text" name="return_reason" style="width:100%" placeholder="差戻しの理由（必須）"><button class="btn danger" name="action" value="return">差し戻す</button></details>
  ${probs.length ? `<div class="box warnbox"><b>確定までに必要な入力：${probs.length}件</b><ul>${probs.slice(0, 15).map(p => `<li>${h(p[1])}</li>`).join("")}</ul></div>` : ""}` : ""}</form></div></div>`;
}

function pageReview2(c) {
  const a = L.assignments(DB, c.case_id), ss = sessions(c.case_id), sess = ss.SECOND;
  if (!sess) return caseNav(c, "review2") + "<p class='muted'>この症例は二重評価の対象ではありません。</p>";
  const mine = a.REVIEWER2 === ME.user_id;
  if (!mine && !ME.roles.includes("SUPERVISOR")) return caseNav(c, "review2") + "<p class='muted'>この症例の二重評価の担当ではありません。</p>";
  const ed = mine && c.progress_code === "S3", draft = sess.status_code === "DRAFT", first = ss.FIRST;
  const both = ["SUBMIT", "FIX"].includes(sess.status_code) && ["SUBMIT", "FIX"].includes(first.status_code);
  const revs = revsOf(sess.review_session_id), firsts = both ? revsOf(first.review_session_id) : {};
  const items = L.reviewItems(c).map(x => {
    const v = x.review_item_id, r = revs[v] || {}, f1 = firsts[v];
    let cmp = "";
    if (both) {
      const ag = L.agreement(f1 && f1.rating_at_submit, r.rating_at_submit);
      cmp = `<div>第一評価（協議前）<b>${f1 ? f1.rating_at_submit : ""}</b>（現在 ${f1 ? f1.rating_code : ""}）／第二評価 <b>${r.rating_at_submit || ""}</b>／<span class="${ag === "完全一致" ? "ok" : "warn"}">${ag || ""}</span></div>
      ${f1 && f1.rationale ? `<div class="muted">第一の根拠：${h(f1.rationale)}</div>` : ""}
      ${ag && ag !== "完全一致" ? `協議結果 <select name="disc_${v}" ${ed ? "" : "disabled"}><option value=""></option><option value="KEEP" ${r.discussion_code === "KEEP" ? "selected" : ""}>協議し第一評価を維持</option><option value="CHG" ${r.discussion_code === "CHG" ? "selected" : ""}>協議し第一評価を変更</option></select>` : `<input type="hidden" name="disc_${v}" value="${ag ? "SAME" : ""}">`}`;
    }
    const dis = ed && draft ? "" : "disabled";
    return `<div class="item"><b>${v} ${h(x.item_name)}</b><div class="muted">${h(x.criteria)}</div>${x.basis ? `<div class="muted basis">根拠：${h(x.basis)}</div>` : ""}<details><summary class="muted">C・Dの目安</summary><div>C：${h(x.anchor_c)}</div><div>D：${h(x.anchor_d)}</div></details>
    <span class="opts" style="display:inline-flex">${["A", "B", "C", "D", "E"].map(g => `<label><input type="radio" name="g_${v}" value="${g}" ${r.rating_code === g ? "checked" : ""} ${dis}>${g}</label>`).join("")}</span>
    <textarea name="rat_${v}" placeholder="根拠の要点" ${dis}>${h(r.rationale)}</textarea>${cmp}</div>`;
  }).join("");
  return caseNav(c, "review2") + `<p class="muted">第一検証者の評価は、あなたの評価を提出するまで表示されません。一致率は協議前の評価で計算します。</p>
  <div class="grid2"><div class="pane">${recordHTML(caseDoc(c), true)}</div><div><form data-act="review2" data-cid="${c.case_id}">${items}
  ${ed ? `<div class="bar">${draft ? '<button class="btn sub" name="action" value="save">保存</button><button class="btn" name="action" value="submit">提出</button>' : both ? '<button class="btn" name="action" value="discuss">協議結果を保存</button>' : "<span class='muted'>第一検証者の提出を待っています</span>"}</div>` : ""}</form></div></div>`;
}

function pageUpper(c) {
  if (!ME.roles.includes("SUPERVISOR")) return caseNav(c, "upper") + "<p class='muted'>権限がありません。</p>";
  const first = sessions(c.case_id).FIRST;
  if (!first) return caseNav(c, "upper") + "<p class='muted'>一次検証がまだありません。</p>";
  const ed = ["S5", "S6"].includes(c.progress_code), items = {}; L.reviewItems(c).forEach(x => { items[x.review_item_id] = x; });
  const cd = DB.review.filter(r => r.review_session_id === first.review_session_id && ["C", "D"].includes(r.rating_code)).sort((a, b) => a.review_item_id.localeCompare(b.review_item_id));
  const causes = DB.cause.filter(x => x.case_id === c.case_id), imps = DB.improvement.filter(x => x.case_id === c.case_id);
  const cdHtml = cd.map(r => `<div class="item cd"><b>${r.review_item_id} ${h((items[r.review_item_id] || {}).item_name)}：評価 ${r.rating_code}</b><div>根拠：${h(r.rationale)}</div><div>改善事項：${h(r.improvement_item)}</div>
    ${causes.filter(x => x.review_item_id === r.review_item_id).map(x => `<div class="box">${x.cause_id}：${h(lab("L_CAUSE", x.cause_category_code))}・${h(lab("L_LEVEL", x.factor_level_code))}／${h(x.cause_detail)}（確実性：${h(lab("L_CERT", x.certainty_code))}）</div>`).join("") || "<div class='err'>原因分析が未登録です</div>"}
    ${ed ? `<details><summary>原因を追加</summary><form data-act="addCause" data-cid="${c.case_id}" data-vid="${r.review_item_id}">原因分類 <select name="cause_category_code">${options("L_CAUSE")}</select> 要因レベル <select name="factor_level_code">${options("L_LEVEL")}</select> 確実性 <select name="certainty_code">${options("L_CERT")}</select><textarea name="cause_detail" placeholder="原因の詳細"></textarea><button class="btn">追加</button></form></details>` : ""}</div>`).join("") || "<p class='muted'>C・D評価の項目はありません。</p>";
  const impRows = imps.map(p => `<tr><td>${p.improvement_id}</td><td>${p.cause_id.slice(-3)}</td><td>${h(lab("L_IMPCAT", p.improvement_category_code))}<br>${h(p.improvement_content)}</td>
    <td>${h(p.department_text)}<br><span class="${p.due_date && p.due_date < today() && !["DONE", "STOP", "NN"].includes(p.status_code) ? "err" : ""}">${h(p.due_date)}</span></td><td>${h(p.effect_check_method)}${p.effect_check_due ? `（${p.effect_check_due}）` : ""}</td>
    <td>${ed ? `<form data-act="updImp" data-cid="${c.case_id}" data-pid="${p.improvement_id}"><select name="status_code">${options("L_STATUS", p.status_code, false)}</select> 実施日 <input type="date" name="done_date" value="${h(p.done_date)}"><br>
    効果 <select name="effect_result_code">${options("L_EFFECT", p.effect_result_code)}</select> 再発 <select name="recurrence_code">${options("L_RECUR", p.recurrence_code)}</select> <button class="btn sub">更新</button></form>` : `${h(lab("L_STATUS", p.status_code))}／${h(lab("L_EFFECT", p.effect_result_code))}／${h(lab("L_RECUR", p.recurrence_code))}`}</td></tr>`).join("") || "<tr><td colspan='6' class='muted'>改善策はまだありません</td></tr>";
  return caseNav(c, "upper") + `<p class="muted">C・D評価の項目ごとに原因を分析し、改善策・担当・期限・効果確認まで記録します。「個人の知識・技術」に分類する前に、同じ状況で別の隊員も同じことをした可能性を検討してください。</p>
  ${ed ? "" : "<p class='muted'>閲覧のみ（入力できるのは状態が「上位検証中」「改善策実施中」のときです）</p>"}
  <h2>C・D評価の項目と原因</h2>${cdHtml}<h2>改善策</h2><table><tr><th>ID</th><th>原因</th><th>区分・内容</th><th>担当・期限</th><th>効果確認方法</th><th>状況・効果・再発</th></tr>${impRows}</table>
  ${ed && causes.length ? `<details class="box"><summary>改善策を追加</summary><form data-act="addImp" data-cid="${c.case_id}">関連する原因 <select name="cause_id">${causes.map(x => `<option value="${x.cause_id}">${x.cause_id}（${x.review_item_id}）</option>`).join("")}</select>
  改善区分 <select name="improvement_category_code">${options("L_IMPCAT")}</select><textarea name="improvement_content" placeholder="改善内容"></textarea>
  担当部署 <input type="text" name="department_text"> 実施期限 <input type="date" name="due_date"><br>効果確認方法 <input type="text" name="effect_check_method" style="width:60%"> 確認時期 <input type="date" name="effect_check_due"> <button class="btn">追加</button></form></details>` : ""}
  ${ed ? `<form data-act="advance" data-cid="${c.case_id}" class="bar">${c.progress_code === "S5" ? '<button class="btn" name="action" value="to_s6">改善策の決定を終える（改善策実施中へ）</button>' : '<button class="btn" name="action" value="to_s7">完了にする（全改善策の効果確認済み）</button>'}</form>` : ""}`;
}

function pageStats() {
  const sup = ME.roles.includes("SUPERVISOR"), cnt = (arr, f) => { const o = {}; arr.forEach(x => { const k = f(x); o[k] = (o[k] || 0) + 1; }); return o; };
  const table = (head, rows) => `<table><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr>${rows.join("") || `<tr><td colspan="${head.length}" class="muted">データはまだありません</td></tr>`}</table>`;
  let html = "<h1>集計・分析</h1>";
  if (sup) {
    const fixedFirst = DB.review_session.filter(s => s.session_role === "FIRST" && s.status_code === "FIX").map(s => s.review_session_id);
    const revs = DB.review.filter(r => fixedFirst.includes(r.review_session_id)), names = {}; Object.values(MASTERS.criteria_sets).flat().forEach(x => { names[x.review_item_id] = x.item_name; });
    const byItem = {}; revs.forEach(r => { const o = byItem[r.review_item_id] = byItem[r.review_item_id] || { A: 0, B: 0, C: 0, D: 0, E: 0, good: 0, div: 0 }; if (r.rating_code) o[r.rating_code]++; if (r.good_practice_code === "Y") o.good++; if (r.divergence_reason) o.div++; });
    const agree = {};
    for (const f of DB.review_session.filter(s => s.session_role === "FIRST")) {
      const s2 = DB.review_session.find(s => s.case_id === f.case_id && s.session_role === "SECOND"); if (!s2) continue;
      const r1 = revsOf(f.review_session_id);
      for (const r of DB.review.filter(x => x.review_session_id === s2.review_session_id)) {
        const ag = L.agreement((r1[r.review_item_id] || {}).rating_at_submit, r.rating_at_submit); if (!ag) continue;
        const o = agree[r.review_item_id] = agree[r.review_item_id] || { n: 0, exact: 0, within1: 0, chg: 0 };
        o.n++; if (ag === "完全一致") o.exact++; if (["完全一致", "1段階差"].includes(ag)) o.within1++; if (r.discussion_code === "CHG") o.chg++;
      }
    }
    const tot = Object.values(agree).reduce((a, o) => ({ n: a.n + o.n, exact: a.exact + o.exact, within1: a.within1 + o.within1, chg: a.chg + o.chg }), { n: 0, exact: 0, within1: 0, chg: 0 });
    const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "";
    const causeC = {}; DB.cause.forEach(x => { const o = causeC[x.cause_category_code] = causeC[x.cause_category_code] || { n: 0, cases: new Set() }; o.n++; o.cases.add(x.case_id); });
    const impC = {}; DB.improvement.forEach(p => { const o = impC[p.improvement_category_code] = impC[p.improvement_category_code] || { n: 0, done: 0, over: 0, recur: 0 }; o.n++; if (p.status_code === "DONE") o.done++; if (p.due_date && p.due_date < today() && !["DONE", "STOP", "NN"].includes(p.status_code)) o.over++; if (p.recurrence_code === "YES") o.recur++; });
    html += `<p class="muted">確定した一次検証のみを集計します。検証者別の分布は順位付けには使いません。</p><h2>症例区分別・状態別の件数</h2>
    ${table(["症例区分", "件数"], Object.entries(cnt(DB.case_record, c => c.case_category_code)).map(([k, v]) => `<tr><td>${h(lab("L_CASECAT", k))}</td><td>${v}</td></tr>`))}
    ${table(["状態", "件数"], Object.entries(cnt(DB.case_record, c => c.progress_code)).sort().map(([k, v]) => `<tr><td>${PROGRESS[k]}</td><td>${v}</td></tr>`))}
    <h2>検証項目別の評価区分（C+D＝同種の改善課題が出た症例数）</h2>
    ${table(["項目", "A", "B", "C", "D", "E", "C+D", "良好事例", "参考評価と相違"], Object.keys(byItem).sort().map(k => { const o = byItem[k]; return `<tr><td>${k} ${h(names[k])}</td><td>${o.A}</td><td>${o.B}</td><td>${o.C}</td><td>${o.D}</td><td>${o.E}</td><td class="${o.C + o.D >= 2 ? "err" : ""}">${o.C + o.D}</td><td>${o.good}</td><td>${o.div}</td></tr>`; }))}
    <h2>二重評価の一致状況（協議前の評価）</h2>
    ${table(["項目", "評価数", "完全一致", "完全一致率", "1段階以内", "協議で変更"], Object.keys(agree).sort().map(k => { const o = agree[k]; return `<tr><td>${k} ${h(names[k])}</td><td>${o.n}</td><td>${o.exact}</td><td>${pct(o.exact, o.n)}</td><td>${pct(o.within1, o.n)}</td><td>${o.chg}</td></tr>`; }).concat(tot.n ? [`<tr><th>全項目</th><th>${tot.n}</th><th>${tot.exact}</th><th>${pct(tot.exact, tot.n)}</th><th>${pct(tot.within1, tot.n)}</th><th>${tot.chg}</th></tr>`] : []))}
    <h2>原因分類</h2>${table(["原因分類", "件数", "症例数"], Object.entries(causeC).map(([k, o]) => `<tr><td>${h(lab("L_CAUSE", k))}</td><td>${o.n}</td><td>${o.cases.size}</td></tr>`))}
    <h2>改善策</h2>${table(["改善区分", "件数", "実施済", "期限超過", "再発あり"], Object.entries(impC).map(([k, o]) => `<tr><td>${h(lab("L_IMPCAT", k))}</td><td>${o.n}</td><td>${o.done}</td><td class="${o.over ? "err" : ""}">${o.over}</td><td>${o.recur}</td></tr>`))}`;
  }
  const mineIds = DB.review_session.filter(s => s.reviewer_id === ME.user_id).map(s => s.review_session_id);
  const mine = cnt(DB.review.filter(r => mineIds.includes(r.review_session_id) && r.rating_code), r => r.rating_code);
  return html + `<h2>あなたの評価分布（本人のみ表示）</h2>${table(Object.keys(mine).sort().length ? Object.keys(mine).sort() : ["評価"], Object.keys(mine).length ? [`<tr>${Object.keys(mine).sort().map(k => `<td>${mine[k]}</td>`).join("")}</tr>`] : [])}`;
}

const FIELD_LABELS = [["n_", "{}の補足"], ["note_", "{}の内容"], ["content_", "{}行目の内容"], ["remarks_", "{}行目の備考"], ["rtext_", "{}行目の理由"],
  ["info_", "{}行目の使った情報"], ["action_", "{}行目の実施した活動"], ["cons_", "{}行目の制約"], ["rat_", "{}の評価根拠"], ["imp_", "{}の改善事項"],
  ["div_", "{}の参考評価と異なる理由"], ["cpm_", "{}のメモ"], ["situation_summary", "当時情報の要約"], ["return_reason", "差戻しの理由"],
  ["cause_detail", "原因の詳細"], ["improvement_content", "改善内容"], ["effect_check_method", "効果確認方法"], ["department_text", "担当部署"]];
// 保存した自由記述に個人情報らしい記載があれば警告する（保存は妨げない。app/app.py の warn_pii と同じ）
function warnPii(d) {
  for (const [key, val] of d.entries()) {
    if (typeof val !== "string" || val.length < 2) continue;
    const w = L.piiWarnings(val); if (!w.length) continue;
    let name = key;
    for (const [pre, fmt] of FIELD_LABELS) {
      if (!key.startsWith(pre)) continue;
      const rest = key.slice(pre.length);
      name = fmt.includes("{}") ? fmt.replace("{}", /^\d+$/.test(rest) ? String(+rest + 1) : rest) : fmt;
      break;
    }
    flash(`個人を特定できる情報の可能性（${w.join("・")}）：${name}。保存しましたが、不要なら書き換えてください。`);
  }
}

const H = {
  login(f, d) { const u = USERS.find(x => x.user_id === d.get("user_id")); if (!u) return flash("利用者を選んでください"); setMe(u); audit("LOGIN", null, null, null, null, null, "デモ用簡易ログイン"); save(); go("#/"); },
  filter(f, d) { go(`#/cases?cat=${d.get("cat") || ""}&prog=${d.get("prog") || ""}`); },
  caseNew(f, d) {
    if (!ME.roles.includes("CREW")) return;
    const need = ["occurrence_month", "case_category_code", "age_group_code", "etiology_code", "review_target_code"];
    if (need.some(k => !d.get(k))) return flash("必須項目（*）をすべて選んでください");
    const year = parseInt(d.get("fiscal_year"), 10) || new Date().getFullYear();
    let n = DB.case_record.filter(c => c.fiscal_year === year).length + 1, cid;
    do { cid = `${year}-${String(n++).padStart(4, "0")}`; } while (getCase(cid));
    const row = { case_id: cid, fiscal_year: year, occurrence_month: d.get("occurrence_month"), case_category_code: d.get("case_category_code"), age_group_code: d.get("age_group_code"),
      sex_code: nz(d.get("sex_code")), etiology_code: d.get("etiology_code"), review_target_code: d.get("review_target_code"), crew_unit_id: ME.unit_id, progress_code: "S1",
      question_version_id: MASTERS.versions.QUESTION, criteria_version_id: null, registered_at: today(), registered_by: ME.user_id, submitted_at: null };
    DB.case_record.push(row); audit("CREATE", "case_record", cid, cid, null, row); save();
    flash(`症例 ${cid} を登録しました。続けて活動記録を入力してください。`); go(`#/case/${cid}/activity`);
  },
  activity(f, d, act, c) {
    if (!L.canEditActivity(ME, c)) return;
    const codes = {}; L.qs(c.question_version_id).forEach(q => { codes[q.question_id] = nz(d.get("q_" + q.question_id)); });
    const vis = L.visibleQuestions(c.case_category_code, codes, c.question_version_id);
    for (const q of L.qs(c.question_version_id)) {
      if (!L.applies(q, c.case_category_code)) continue;
      const t = q.record_category === "自己評価" ? "self_evaluation" : "answer", code = codes[q.question_id], note = nz(d.get("n_" + q.question_id));
      const old = DB[t].find(r => r.case_id === c.case_id && r.question_id === q.question_id);
      if (!old && !code && !note) continue;
      if (old && old.answer_code === code && old.note_text === note) continue;
      const before = old ? { answer_code: old.answer_code, note_text: old.note_text } : null;
      if (old) Object.assign(old, { answer_code: code, note_text: note, is_applicable: vis[q.question_id] });
      else DB[t].push({ case_id: c.case_id, question_id: q.question_id, question_version_id: c.question_version_id, answer_code: code, note_text: note, is_applicable: vis[q.question_id] });
      audit("UPDATE", t, `${c.case_id}-${q.question_id}`, c.case_id, before, { answer_code: code, note_text: note });
    }
    warnPii(d); save(); flash("保存しました"); render();
  },
  info(f, d, act, c) {
    if (!L.canEditActivity(ME, c)) return;
    for (const it of L.infos(c.question_version_id).filter(x => L.applies(x, c.case_category_code))) {
      const i = it.info_item_id, v = { awareness_code: nz(d.get("aw_" + i)), acquired_time: nz(d.get("t_" + i)), source_code: nz(d.get("src_" + i)), reflection_code: nz(d.get("ref_" + i)), note_text: nz(d.get("note_" + i)) };
      const old = DB.info_record.find(r => r.case_id === c.case_id && r.info_item_id === i);
      if (!old && !Object.values(v).some(Boolean)) continue;
      if (old && Object.keys(v).every(k => old[k] === v[k])) continue;
      const before = old ? Object.fromEntries(Object.keys(v).map(k => [k, old[k]])) : null;
      if (old) Object.assign(old, v); else DB.info_record.push({ case_id: c.case_id, info_item_id: i, item_version_id: c.question_version_id, ...v });
      audit("UPDATE", "info_record", `${c.case_id}-${i}`, c.case_id, before, v);
    }
    warnPii(d); save(); flash("保存しました"); render();
  },
  events(f, d, act, c) {
    if (!L.canEditActivity(ME, c)) return;
    const n = parseInt(d.get("rows"), 10) || 0;
    for (let i = 0; i < n; i++) {
      const eid = nz(d.get("id_" + i)), typ = nz(d.get("type_" + i)), ex = eid && DB.event.find(e => e.event_id === eid);
      if (eid && (d.get("del_" + i) || !typ)) {
        if (DB.decision.some(x => x.event_id === eid)) { flash(`${eid} は判断・活動の記録から参照されているため削除できません`); continue; }
        DB.event = DB.event.filter(e => e.event_id !== eid); audit("DELETE", "event", eid, c.case_id, ex, null); continue;
      }
      if (!typ) continue;
      const t = nz(d.get("time_" + i));
      const v = { day_offset: parseInt(d.get("day_" + i), 10) || 0, event_time: t, time_certainty_code: nz(d.get("cert_" + i)) || (t ? "MEM" : "UNK"), event_type_code: typ, content: nz(d.get("content_" + i)), remarks: nz(d.get("remarks_" + i)) };
      if (ex) { if (Object.keys(v).some(k => ex[k] !== v[k])) { const before = Object.fromEntries(Object.keys(v).map(k => [k, ex[k]])); Object.assign(ex, v); audit("UPDATE", "event", eid, c.case_id, before, v); } }
      else {
        const id = nextNo(DB.event.filter(e => e.case_id === c.case_id).map(e => e.event_id), `${c.case_id}-E`);
        DB.event.push({ event_id: id, case_id: c.case_id, ...v, input_order: parseInt(id.slice(-2), 10), recorded_by: ME.user_id }); audit("CREATE", "event", id, c.case_id, null, v);
      }
    }
    warnPii(d); save(); flash("保存しました"); render();
  },
  decisions(f, d, act, c) {
    if (!L.canEditActivity(ME, c)) return;
    const n = parseInt(d.get("rows"), 10) || 0;
    for (let i = 0; i < n; i++) {
      const did = nz(d.get("id_" + i)), content = nz(d.get("content_" + i)), ex = did && DB.decision.find(x => x.decision_id === did);
      if (did && (d.get("del_" + i) || !content)) { DB.decision = DB.decision.filter(x => x.decision_id !== did); audit("DELETE", "decision", did, c.case_id, ex, null); continue; }
      if (!content) continue;
      const v = { event_id: nz(d.get("event_" + i)), decision_time: nz(d.get("time_" + i)), decision_type_code: nz(d.get("type_" + i)), decision_content: content, reason_code: nz(d.get("rcode_" + i)),
        reason_text: nz(d.get("rtext_" + i)), info_used: nz(d.get("info_" + i)), action_taken: nz(d.get("action_" + i)), action_result_code: nz(d.get("result_" + i)), constraints_text: nz(d.get("cons_" + i)) };
      if (!v.reason_code && !v.reason_text) { flash(`${did || "新しい判断"}：判断理由（区分か具体的な理由）を入力してください。この行は保存していません`); continue; }
      if (ex) { if (Object.keys(v).some(k => ex[k] !== v[k])) { const before = Object.fromEntries(Object.keys(v).map(k => [k, ex[k]])); Object.assign(ex, v); audit("UPDATE", "decision", did, c.case_id, before, v); } }
      else { const id = nextNo(DB.decision.filter(x => x.case_id === c.case_id).map(x => x.decision_id), `${c.case_id}-D`); DB.decision.push({ decision_id: id, case_id: c.case_id, ...v }); audit("CREATE", "decision", id, c.case_id, null, v); }
    }
    warnPii(d); save(); flash("保存しました"); render();
  },
  submit(f, d, act, c) {
    if (!L.canEditActivity(ME, c)) return;
    if (L.activityProblems(DB, c).some(p => p[3] === "error")) return flash("未入力の項目があるため提出できません");
    c.submitted_at = today();
    if (Object.keys(L.assignments(DB, c.case_id)).length) setProgress(c, "S3", "差戻し後の再提出（検証担当は割当済み）"); else setProgress(c, "S2", "活動隊が提出");
    save(); flash("提出しました。以後は差戻しがない限り編集できません。"); go(`#/case/${c.case_id}/view`);
  },
  assign(f, d, act, c) {
    if (!ME.roles.includes("SUPERVISOR") || c.progress_code !== "S2") return;
    const r1 = d.get("r1"), r2 = nz(d.get("r2")), unit = id => (USERS.find(u => u.user_id === id) || {}).unit_id;
    if (!r1) return flash("第一検証者を選んでください");
    if (unit(r1) === c.crew_unit_id || (r2 && unit(r2) === c.crew_unit_id)) return flash("活動隊と同じ所属の検証者は割り当てられません（自隊の症例を検証しない）");
    if (r2 && r2 === r1) return flash("第一検証者と第二検証者は別の人にしてください");
    let sid = DB.review_session.reduce((m, s) => Math.max(m, s.review_session_id), 0);
    [["REVIEWER1", r1, "FIRST"], ["REVIEWER2", r2, "SECOND"]].forEach(([role, uid, sr]) => {
      if (!uid) return;
      DB.case_assignment.push({ case_id: c.case_id, assignment_role: role, user_id: uid, assigned_by: ME.user_id });
      DB.review_session.push({ review_session_id: ++sid, case_id: c.case_id, session_role: sr, reviewer_id: uid, criteria_version_id: MASTERS.versions.CRITERIA, situation_summary: null, status_code: "DRAFT", review_date: null });
    });
    c.criteria_version_id = MASTERS.versions.CRITERIA;
    audit("ASSIGN", "case_assignment", c.case_id, c.case_id, null, { REVIEWER1: r1, REVIEWER2: r2 }); setProgress(c, "S3", "検証担当を割当");
    save(); flash(`${c.case_id} の検証担当を割り当てました`); render();
  },
  review(f, d, act, c) {
    const a = L.assignments(DB, c.case_id), ss = sessions(c.case_id), sess = ss.FIRST;
    if (!(a.REVIEWER1 === ME.user_id && c.progress_code === "S3" && ["DRAFT", "SUBMIT"].includes(sess.status_code))) return;
    if (act === "return") {
      const reason = nz(d.get("return_reason")); if (!reason) return flash("差戻しの理由を入力してください");
      c.submitted_at = null; setProgress(c, "S1", "差戻し：" + reason); save(); flash("活動隊に差し戻しました"); return go("#/");
    }
    saveReview(sess, c, d, true);
    if (act === "submit") {
      const probs = L.reviewProblems(DB, c, sess, true);
      if (probs.length) { probs.slice(0, 12).forEach(p => flash(p[1])); flash("入力が不足しているため提出できません（入力内容は保存しました）"); save(); return render(); }
      DB.review.filter(r => r.review_session_id === sess.review_session_id).forEach(r => { r.rating_at_submit = r.rating_code; });
      sess.status_code = "SUBMIT"; audit("SUBMIT", "review_session", String(sess.review_session_id), c.case_id, null, null, "第一評価を提出（協議前の値を保存）"); flash("提出しました。協議前の評価を保存しました。");
    } else if (act === "fix") {
      const pend = pendingDiscussion(ss);
      if (sess.status_code !== "SUBMIT") flash("先に提出してください");
      else if (ss.SECOND && ss.SECOND.status_code !== "SUBMIT") flash("第二検証者の評価が提出されていないため確定できません");
      else if (pend.length) flash("不一致の項目に協議結果が入力されていません：" + pend.join("、"));
      else if (L.reviewProblems(DB, c, sess, true).length) flash("入力が不足しているため確定できません");
      else {
        Object.values(ss).forEach(s => { s.status_code = "FIX"; s.review_date = today(); });
        setProgress(c, "S4", "一次検証確定");
        const cd = DB.review.some(r => r.review_session_id === sess.review_session_id && ["C", "D"].includes(r.rating_code));
        setProgress(c, cd ? "S5" : "S7", cd ? "C・Dあり：上位検証へ" : "C・Dなし：完了");
        save(); flash("一次検証を確定しました"); return go(`#/case/${c.case_id}/view`);
      }
    } else flash("保存しました");
    warnPii(d); save(); render();
  },
  review2(f, d, act, c) {
    const a = L.assignments(DB, c.case_id), ss = sessions(c.case_id), sess = ss.SECOND;
    if (!(sess && a.REVIEWER2 === ME.user_id && c.progress_code === "S3")) return;
    const both = ["SUBMIT", "FIX"].includes(sess.status_code) && ["SUBMIT", "FIX"].includes(ss.FIRST.status_code);
    if (sess.status_code === "DRAFT") {
      saveReview(sess, c, d, false);
      if (act === "submit") {
        const probs = L.reviewProblems(DB, c, sess, false);
        if (probs.length) { probs.slice(0, 12).forEach(p => flash(p[1])); flash("未評価の項目があるため提出できません（入力内容は保存しました）"); save(); return render(); }
        DB.review.filter(r => r.review_session_id === sess.review_session_id).forEach(r => { r.rating_at_submit = r.rating_code; });
        sess.status_code = "SUBMIT"; audit("SUBMIT", "review_session", String(sess.review_session_id), c.case_id, null, null, "第二評価を提出"); flash("提出しました");
      } else flash("保存しました");
    } else if (both && act === "discuss") {
      L.reviewItems(c).forEach(x => { const r = DB.review.find(y => y.review_session_id === sess.review_session_id && y.review_item_id === x.review_item_id); if (r) r.discussion_code = nz(d.get("disc_" + x.review_item_id)); });
      audit("UPDATE", "review", String(sess.review_session_id), c.case_id, null, null, "協議結果を入力");
      flash("協議結果を保存しました。第一評価を変更する場合は、第一検証者が一次検証画面で修正します。");
    }
    warnPii(d); save(); render();
  },
  addCause(f, d, act, c) {
    const need = ["cause_category_code", "factor_level_code", "cause_detail", "certainty_code"];
    if (!need.every(k => nz(d.get(k)))) return flash("原因分類・要因レベル・原因の詳細・確実性はすべて必須です");
    const id = nextNo(DB.cause.filter(x => x.case_id === c.case_id).map(x => x.cause_id), `${c.case_id}-C`), v = Object.fromEntries(need.map(k => [k, nz(d.get(k))]));
    DB.cause.push({ cause_id: id, case_id: c.case_id, review_session_id: sessions(c.case_id).FIRST.review_session_id, review_item_id: f.dataset.vid, ...v });
    audit("CREATE", "cause", id, c.case_id, null, v); warnPii(d); save(); flash(`${id} を登録しました`); render();
  },
  addImp(f, d, act, c) {
    const cat = d.get("improvement_category_code");
    if (!nz(d.get("cause_id")) || !cat || !nz(d.get("improvement_content"))) return flash("関連する原因・改善区分・改善内容は必須です");
    if (!["P09", "P10"].includes(cat) && !(nz(d.get("department_text")) && nz(d.get("due_date")))) return flash("担当部署と実施期限を入力してください（経過観察・改善措置不要を除く）");
    const id = nextNo(DB.improvement.filter(x => x.case_id === c.case_id).map(x => x.improvement_id), `${c.case_id}-P`);
    const v = { cause_id: d.get("cause_id"), improvement_category_code: cat, improvement_content: nz(d.get("improvement_content")), department_text: nz(d.get("department_text")), due_date: nz(d.get("due_date")),
      status_code: "NS", done_date: null, effect_check_method: nz(d.get("effect_check_method")), effect_check_due: nz(d.get("effect_check_due")), effect_result_code: null, recurrence_code: null };
    DB.improvement.push({ improvement_id: id, case_id: c.case_id, ...v }); audit("CREATE", "improvement", id, c.case_id, null, v); warnPii(d); save(); flash(`${id} を登録しました`); render();
  },
  updImp(f, d, act, c) {
    const p = DB.improvement.find(x => x.improvement_id === f.dataset.pid);
    const v = { status_code: d.get("status_code") || "NS", done_date: nz(d.get("done_date")), effect_result_code: nz(d.get("effect_result_code")), recurrence_code: nz(d.get("recurrence_code")) };
    if (v.status_code === "DONE" && !v.done_date) return flash("実施済にする場合は実施日を入力してください");
    const before = Object.fromEntries(Object.keys(v).map(k => [k, p[k]])); Object.assign(p, v); audit("UPDATE", "improvement", p.improvement_id, c.case_id, before, v); save(); flash(`${p.improvement_id} を更新しました`); render();
  },
  advance(f, d, act, c) {
    if (act === "to_s6") {
      const first = sessions(c.case_id).FIRST;
      const missing = DB.review.filter(r => r.review_session_id === first.review_session_id && ["C", "D"].includes(r.rating_code) && !DB.cause.some(x => x.review_session_id === first.review_session_id && x.review_item_id === r.review_item_id)).map(r => r.review_item_id);
      if (missing.length) return flash("原因分析が未接続のC・D項目があります：" + missing.join("、"));
      setProgress(c, "S6", "改善策を決定"); flash("改善策実施中にしました");
    } else if (act === "to_s7") {
      const rest = DB.improvement.filter(p => p.case_id === c.case_id && !(["STOP", "NN"].includes(p.status_code) || (p.status_code === "DONE" && p.effect_result_code && p.effect_result_code !== "PEND")));
      if (rest.length) return flash("実施済・効果確認済みになっていない改善策があります：" + rest.map(p => p.improvement_id).join("、"));
      setProgress(c, "S7", "全改善策の効果確認を終えた"); flash("完了にしました");
    }
    save(); render();
  },
};
function saveReview(sess, c, d, first) {
  const sid = sess.review_session_id;
  if (first) { const s = nz(d.get("situation_summary")); if (s !== sess.situation_summary) { audit("UPDATE", "review_session", String(sid), c.case_id, { situation_summary: sess.situation_summary }, { situation_summary: s }); sess.situation_summary = s; } }
  for (const x of L.reviewItems(c)) {
    const v = x.review_item_id;
    let val;
    if (first) {
      const ans = x.checkpoints.map(cp => {
        const a = nz(d.get("cp_" + cp.checkpoint_id)), memo = nz(d.get("cpm_" + cp.checkpoint_id));
        const k = DB.review_check.find(r => r.review_session_id === sid && r.checkpoint_id === cp.checkpoint_id);
        if (k) Object.assign(k, { answer_code: a, memo }); else DB.review_check.push({ review_session_id: sid, checkpoint_id: cp.checkpoint_id, criteria_version_id: sess.criteria_version_id, answer_code: a, memo });
        return a;
      });
      val = { rating_code: nz(d.get("g_" + v)), reference_rating: x.checkpoints.length ? L.referenceRating(ans) : null, divergence_reason: nz(d.get("div_" + v)), rationale: nz(d.get("rat_" + v)),
        improvement_item: nz(d.get("imp_" + v)), referenced_records: nz(d.get("refrec_" + v)), viewpoint_code: nz(d.get("view_" + v)), good_practice_code: nz(d.get("good_" + v)) };
    } else val = { rating_code: nz(d.get("g_" + v)), rationale: nz(d.get("rat_" + v)) };
    const old = DB.review.find(r => r.review_session_id === sid && r.review_item_id === v);
    if (old && Object.keys(val).every(k => old[k] === val[k])) continue;
    const before = old ? Object.fromEntries(Object.keys(val).map(k => [k, old[k]])) : null;
    if (old) Object.assign(old, val); else DB.review.push({ review_session_id: sid, review_item_id: v, criteria_version_id: sess.criteria_version_id, rating_at_submit: null, discussion_code: null, ...val });
    if (sess.status_code !== "DRAFT" && before && before.rating_code !== val.rating_code) audit("RATING_CHANGE", "review", `${sid}-${v}`, c.case_id, { rating_code: before.rating_code }, { rating_code: val.rating_code }, "協議後の変更");
    else audit("UPDATE", "review", `${sid}-${v}`, c.case_id, before, val);
  }
}
function pendingDiscussion(ss) {
  if (!ss.SECOND) return [];
  const r1 = revsOf(ss.FIRST.review_session_id);
  return DB.review.filter(r => r.review_session_id === ss.SECOND.review_session_id && !r.discussion_code && (() => { const a = L.agreement((r1[r.review_item_id] || {}).rating_at_submit, r.rating_at_submit); return a && a !== "完全一致"; })()).map(r => r.review_item_id);
}

// ------------------------------------------------------------ ボタン・ファイル
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function toCSV(rows) {
  if (!rows.length) return "";
  const cols = Object.keys(rows.reduce((o, r) => Object.assign(o, r), {})).filter(k => !k.startsWith("_"));
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [cols.join(",")].concat(rows.map(r => cols.map(k => q(r[k])).join(","))).join("\r\n");
}
const CLICK = {
  logout() { setMe(null); go("#/login"); },
  print() { window.print(); },
  csv(el) { const t = el.dataset.table; audit("EXPORT", t, null, null, null, null, `CSV ${DB[t].length}件`); save(); download(`${t}.csv`, "﻿" + toCSV(DB[t]), "text/csv"); },
  backup() { download(`jigo-kensho-demo-backup-${today()}.json`, JSON.stringify({ app: "jigo-kensho-demo", build: BUILD, saved_at: now(), data: DB }, null, 1), "application/json"); },
  reset() { if (!confirm("デモデータを初期化します。入力した内容はすべて消えます。よろしいですか？")) return; DB = clone(SAMPLE_DB); save(); flash("初期化しました"); render(); },
};
function restore(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (o.app !== "jigo-kensho-demo" || !o.data || !Array.isArray(o.data.case_record)) throw new Error("形式が違います");
      DB = o.data; TABLES.forEach(t => { if (!DB[t]) DB[t] = []; }); save(); flash(`バックアップを読み込みました（症例 ${DB.case_record.length} 件）`);
    } catch (e) { flash("読み込めませんでした：" + e.message); }
    render();
  };
  r.readAsText(file);
}

// ------------------------------------------------------------ 画面の切り替え
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function parse() {
  const [path, qs] = (location.hash.slice(1) || "/").split("?");
  const q = {}; (qs || "").split("&").filter(Boolean).forEach(p => { const [k, v] = p.split("="); q[k] = decodeURIComponent(v || ""); });
  return { parts: path.split("/").filter(Boolean), q };
}
function render() {
  const { parts, q } = parse();
  let body;
  if (!ME) body = pageLogin();
  else if (!parts.length) body = pageHome();
  else if (parts[0] === "cases") body = pageCases(q);
  else if (parts[0] === "new") body = ME.roles.includes("CREW") ? pageNew() : "<h1>この画面を開く権限がありません。</h1>";
  else if (parts[0] === "assign") body = ME.roles.includes("SUPERVISOR") ? pageAssign() : "<h1>この画面を開く権限がありません。</h1>";
  else if (parts[0] === "stats") body = ME.roles.some(r => ["SUPERVISOR", "REVIEWER"].includes(r)) ? pageStats() : "<h1>この画面を開く権限がありません。</h1>";
  else if (parts[0] === "export") body = ME.roles.includes("SUPERVISOR") ? pageExport() : "<h1>この画面を開く権限がありません。</h1>";
  else if (parts[0] === "audit") body = ME.roles.some(r => ["SUPERVISOR", "SYSADMIN"].includes(r)) ? pageAudit() : "<h1>この画面を開く権限がありません。</h1>";
  else if (parts[0] === "admin") body = ME.roles.includes("SYSADMIN") ? pageAdmin() : "<h1>この画面を開く権限がありません。</h1>";
  else if (parts[0] === "backup") body = pageBackup();
  else if (parts[0] === "case") {
    const c = getCase(parts[1]);
    if (!c) body = "<h1>見つかりません。</h1>";
    else if (!L.canView(DB, ME, c)) body = "<h1>この画面を開く権限がありません。</h1>";
    else {
      const P = { view: pageView, activity: pageActivity, info: pageInfo, events: pageEvents, decisions: pageDecisions, submit: pageSubmit, review: pageReview, review2: pageReview2, upper: pageUpper }[parts[2] || "view"];
      body = P ? P(c) : "<h1>見つかりません。</h1>";
      if (parts[2] === "view" || !parts[2]) { audit("VIEW", "case_record", c.case_id, c.case_id); save(); }
    }
  } else body = "<h1>見つかりません。</h1>";
  document.getElementById("root").innerHTML = layout(body);
  window.scrollTo(0, 0);
  liveBranching(); liveReference();
}

// 質問の分岐（回答の変更に応じて表示・非表示）と参考評価の即時計算
function liveBranching() {
  const rows = [...document.querySelectorAll(".q[data-qid]")];
  if (!rows.length) return;
  const code = id => { const c = document.querySelector(`input[name="q_${id}"]:checked`); return c ? c.value : ""; };
  const update = () => {
    const vis = {};
    rows.forEach(r => {
      const p = r.dataset.cond; let ok = true;
      if (p) ok = !!vis[p] && (r.dataset.show || "").split("|").includes(code(p));
      vis[r.dataset.qid] = ok; r.classList.toggle("hidden", !ok);
      const n = r.querySelector(".notehint"); if (n) n.hidden = !(r.dataset.note || "").split("|").filter(Boolean).includes(code(r.dataset.qid));
    });
  };
  rows.forEach(r => r.addEventListener("change", update)); update();
}
function liveReference() {
  document.querySelectorAll(".item[data-vid]").forEach(item => {
    const out = item.querySelector(".ref"); if (!out) return;
    const calc = () => {
      const g = [...item.querySelectorAll(".cp")];
      out.textContent = REF_LABEL[L.referenceRating(g.map(x => { const c = x.querySelector("input[type=radio]:checked"); return c ? c.value : ""; }))];
    };
    item.addEventListener("change", calc); calc();
  });
}

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, fn = H[f.dataset.act]; if (!fn) return;
  const d = new FormData(f), act = e.submitter ? e.submitter.value : null, c = f.dataset.cid ? getCase(f.dataset.cid) : null;
  if (f.dataset.cid && (!c || !L.canView(DB, ME, c))) return;
  const before = FLASH.length;
  fn(f, d, act, c);
  if (FLASH.length > before) render();
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-click]"); if (!el) return;
  e.preventDefault(); CLICK[el.dataset.click](el);
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.change === "restore") restore(e.target); });
window.addEventListener("hashchange", render);
load(); render();
